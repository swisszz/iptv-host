<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IPTV Player</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card: #121416;
      --muted: #9aa0a6;
      --accent: #ffb86b;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: var(--bg);
      color: #fff;
    }

    header {
      padding: 16px;
      text-align: center;
      background-color: #222;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    #mainLayout {
      display: flex;
      height: calc(100vh - 80px);
      padding: 16px;
      gap: 16px;
      box-sizing: border-box;
    }

    #channelList {
      width: 300px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .channel {
      background: var(--card);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .6);
      text-align: center;
    }

    .thumb {
      height: 140px;
      background: #0b0b0b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumb img {
      max-width: 100%;
      max-height: 100%;
    }

    .meta {
      padding: 8px;
    }

    .meta h3 {
      margin: 6px 0;
      font-size: 1rem;
    }

    .meta p {
      margin: 0;
      color: var(--muted);
      font-size: .85rem;
    }

    button {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 0;
      background: var(--accent);
      cursor: pointer;
      color: #111;
      font-weight: 600;
    }

    #playerSection {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #player {
      width: 100%;
      height: 480px;
      background: #000;
      border-radius: 8px;
      outline: none;
    }

    #status {
      color: var(--muted);
      font-size: .9rem;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>IPTV Player</h1>
</header>

<div id="mainLayout">
  <aside id="channelList">
    <div style="text-align:center;color:var(--muted);margin-bottom:6px">กำลังโหลดช่อง...</div>
  </aside>

  <section id="playerSection">
    <video id="player" controls playsinline></video>
    <div id="status">ยังไม่ได้เลือกช่อง</div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const M3U_URL = "http://99d0dce18193.iedem.com/playlists/uplist/4dfcfb9bf28d57df404b0d2216f615c4/playlist.m3u8"; // URL ของไฟล์ m3u8
  const list = document.getElementById("channelList");
  const player = document.getElementById("player");
  const status = document.getElementById("status");

  let channels = [], currentUrl = "", hlsInstance = null;

  // ฟังก์ชั่นช่วยในการหลีกเลี่ยงการแสดงผล HTML ที่ไม่ถูกต้อง
  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
  }

  // ฟังก์ชั่นแสดงสถานะที่แถบสถานะ
  function setStatus(text) {
    status.textContent = text;
  }

  // ฟังก์ชั่นดึงข้อมูล M3U และแสดงช่อง
  async function fetchM3U() {
    try {
      const res = await fetch(M3U_URL);
      if (!res.ok) throw new Error("ไม่สามารถโหลด M3U (status " + res.status + ")");
      const txt = await res.text();
      parseM3U(txt);
      renderChannels();
    } catch (err) {
      list.innerHTML = `<div style="color:#f66">${err.message}</div>`;
    }
  }

  // ฟังก์ชั่นแยกข้อมูลช่องจาก M3U
  function parseM3U(text) {
    channels = [];
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith("#EXTINF:")) {
        const info = lines[i];
        const url = lines[i + 1] || "";
        const title = (info.split(",").slice(1).join(",") || "Untitled").trim();
        const logo = info.match(/tvg-logo="([^"]+)"/i);
        const group = info.match(/group-title="([^"]+)"/i);
        channels.push({
          title,
          url,
          logo: logo ? logo[1] : "",
          group: group ? group[1] : ""
        });
      }
    }
  }

  // ฟังก์ชั่นแสดงช่องในหน้าเว็บ
  function renderChannels() {
    list.innerHTML = "";
    if (channels.length === 0) {
      list.innerHTML = '<div style="color:var(--muted)">ไม่พบรายการช่องในไฟล์ M3U</div>';
      return;
    }

    const wrap = document.createElement("div");
    list.appendChild(wrap);

    channels.forEach(ch => {
      const div = document.createElement("div");
      div.className = "channel";

      const thumb = document.createElement("div");
      thumb.className = "thumb";

      const img = document.createElement("img");
      img.onerror = () => {
        img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='200'><rect fill='%23111111' width='100%' height='100%'/></svg>";
      };
      img.src = ch.logo || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='200'><rect fill='%23131313' width='100%' height='100%'/></svg>";
      thumb.appendChild(img);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `<h3>${escapeHtml(ch.title)}</h3><p>${escapeHtml(ch.group || "")}</p>`;

      const btn = document.createElement("button");
      btn.textContent = "▶ เล่น";
      btn.onclick = () => onPlayClick(ch);

      div.appendChild(thumb);
      div.appendChild(meta);
      div.appendChild(btn);
      wrap.appendChild(div);
    });
  }

  // ฟังก์ชั่นเมื่อผู้ใช้คลิกที่ช่องเพื่อเล่น
  function onPlayClick(channel) {
    playChannel(channel.url);
  }

  // ฟังก์ชั่นเล่นช่อง
  function playChannel(url) {
    currentUrl = url;
    setStatus("กำลังเล่น...");
    if (hlsInstance) {
      try { hlsInstance.destroy(); } catch (e) {}
      hlsInstance = null;
    }
    if (player.canPlayType('application/vnd.apple.mpegurl')) {
      player.src = url;
      player.play().catch(() => {});
    } else if (window.Hls && Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.attachMedia(player);
      hlsInstance.on(Hls.Events.MEDIA_ATTACHED, () => {
        hlsInstance.loadSource(url);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
          player.play().catch(() => {});
        });
      });
      hlsInstance.on(Hls.Events.ERROR, function (event, data) {
        console.error("hls error", data);
        if (data && data.type === 'networkError') {
          setStatus("เกิดข้อผิดพลาดในการดึงสตรีม (network).");
        } else if (data && data.type === 'mediaError')

          setStatus("เกิดข้อผิดพลาดด้านมีเดีย (media).");
        } else {
          setStatus("เกิดข้อผิดพลาด: " + (data && data.details || "unknown"));
        }
      });
    } else {
      setStatus("เบราว์เซอร์นี้ไม่รองรับ HLS และ hls.js ไม่สามารถทำงานได้");
    }
  }

  fetchM3U();
</script>


</body>
</html>
